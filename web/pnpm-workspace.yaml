# NOTE: Every `vite` import must get the Vite+ build, or TanStack Start
# returns 404. Why: https://viteplus.dev/guide/local-cli
# Upgrade: `pnpm update vite-plus@<new>`, then `pnpm exec vp migrate`.
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
overrides:
  vite@*: "catalog:"

# NOTE: The Vite+ build reports version 1.0.0 but contains Vite 8.3.1.
# This also hides real mismatches: check a new plugin's `vite` range
# against `bundledVersions` in node_modules/vite/package.json.
peerDependencyRules:
  allowAny:
    - vite
