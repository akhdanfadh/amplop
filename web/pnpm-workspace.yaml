# NOTE: Every `vite` import must get the Vite+ build, or TanStack Start
# returns 404. Every `vitest` import must get the Vitest that `vp test`
# runs, or tests see two copies of `expect` and mocks.
# Why: https://viteplus.dev/guide/local-cli
# Upgrade: `pnpm update vite-plus@<new>`, then `pnpm exec vp migrate`, then
# set @vitest/browser-playwright to vitest's version.
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
  vitest: 5.1.0
  "@vitest/browser-playwright": 5.1.0
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"

# NOTE: The Vite+ build reports its own version (1.6.0) but contains
# Vite 8.3.7.
# This also hides real mismatches: check a new plugin's `vite` range
# against `bundledVersions` in node_modules/vite/package.json.
# vitest: the Playwright browser provider and vitest-browser-react ask for
# vitest as a peer; the catalog's override supplies the bundled one.
peerDependencyRules:
  allowAny:
    - vite
    - vitest

# Orval needs esbuild. Its install script only checks the binary that
# pnpm already installs, so it stays off.
allowBuilds:
  esbuild: false

# NOTE: pnpm holds back releases younger than its minimum release age.
# Vite+ 1.6.0 was taken on its release day (the Vitest browser-mode fixes
# GHSA-p458-7748-mcp3 and GHSA-qxg6-89mg-rqv8 need 1.3.0 or later); drop
# these entries once it is older than that age.
minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@1.6.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.6.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.6.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.6.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.6.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.6.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.6.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.6.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.6.0"
  - vite-plus@1.6.0
