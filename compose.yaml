# Development services. Values come from .env; see .env.example.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${AMPLOP_POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${AMPLOP_POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${AMPLOP_POSTGRES_DB:?copy .env.example to .env}

    # Only this machine can connect, not the network.
    ports:
      - 127.0.0.1:${AMPLOP_POSTGRES_PORT:?copy .env.example to .env}:5432

    # PostgreSQL 18 and newer keep data under /var/lib/postgresql/18/docker;
    # mount the parent so data survives recreating the container.
    volumes:
      - postgres:/var/lib/postgresql

    # Ready means it accepts TCP connections. The first start runs a
    # temporary server on a Unix socket only, so a socket check would pass
    # too early. $$ makes Compose pass $ to the container's shell.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 15

  # Catches every message sent to it, for testing system email; nothing
  # reaches a real inbox. backend/README.md lists the settings to enter.
  # Messages are deleted when it stops. The image's own healthcheck tells
  # --wait when it is ready.
  mailpit:
    image: axllent/mailpit:v1.33

    # Only this machine can connect. The defaults keep a .env from before
    # Mailpit working.
    ports:
      - 127.0.0.1:${AMPLOP_MAILPIT_SMTP_PORT:-1025}:1025
      - 127.0.0.1:${AMPLOP_MAILPIT_WEB_PORT:-8025}:8025

  # Google OAuth and Gmail for connecting accounts without a Google
  # project: seeded mailboxes and amplop's development OAuth client, defined
  # in google-emulator/emulate.config.mjs. backend/README.md explains using
  # it. Built here from google-emulator/; state lives in memory, so a
  # restart empties the mailboxes back to the seed and refuses every
  # refresh token handed out before.
  google-emulator:
    build: google-emulator
    image: amplop-google-emulator:local
    environment:
      # The address the browser and Go reach it at, the one amplop is given,
      # so the two cannot drift apart. It is also the ID token's issuer.
      # The defaults keep a .env from before Gmail working.
      EMULATE_BASE_URL: ${AMPLOP_GOOGLE_BASE_URL:-http://127.0.0.1:${AMPLOP_GOOGLE_EMULATOR_PORT:-4000}}
      # For the redirect URI it registers for amplop's client.
      AMPLOP_PUBLIC_URL: ${AMPLOP_PUBLIC_URL:-http://localhost:5173}

    # Only this machine can connect. The image's own healthcheck tells
    # --wait when it is ready.
    ports:
      - 127.0.0.1:${AMPLOP_GOOGLE_EMULATOR_PORT:-4000}:4000

  # The search index, pinned like deploy/compose.yaml's; change both
  # together with the image in backend/internal/meilisearch's tests.
  meilisearch:
    image: getmeili/meilisearch:v1.56.1@sha256:b7ba431bf6f9b26cc86132798f3640964147a699cf23f026b74c6c05dbb1d60d
    environment:
      MEILI_MASTER_KEY: ${AMPLOP_MEILISEARCH_KEY:?add AMPLOP_MEILISEARCH_KEY to .env from .env.example}
      # Development serves a web dashboard at the published port, which
      # asks for the key.
      MEILI_ENV: development
      # Meilisearch sends anonymous usage data unless this is set.
      MEILI_NO_ANALYTICS: "true"

    # Only this machine can connect: serve and the worker run on the host.
    ports:
      - 127.0.0.1:${AMPLOP_MEILISEARCH_PORT:-7700}:7700

    # NOTE: Named after the image's version, as in deploy/compose.yaml: a
    # Meilisearch version refuses to open data another version wrote, so a
    # new version starts on a new, empty volume.
    volumes:
      - meilisearch-1.56.1:/meili_data

    # The image has curl. /health answers without the key.
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:7700/health"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Holds message content behind an S3 API. Pinned like deploy/compose.yaml
  # and the Go tests' image in backend/internal/s3; change all three
  # together.
  seaweedfs:
    image: chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59
    # One process runs every SeaweedFS part. A command replaces the image's
    # whole default, so -dir=/data, which keeps the data in the volume, is
    # repeated. The usage report SeaweedFS sends by default is off.
    command: mini -dir=/data -master.telemetry=false
    # SeaweedFS makes these its admin identity when it has no S3
    # configuration file.
    environment:
      AWS_ACCESS_KEY_ID: ${AMPLOP_S3_ACCESS_KEY_ID:?add AMPLOP_S3_ACCESS_KEY_ID to .env from .env.example}
      AWS_SECRET_ACCESS_KEY: ${AMPLOP_S3_SECRET_ACCESS_KEY:?add AMPLOP_S3_SECRET_ACCESS_KEY to .env from .env.example}

    # Only the S3 port, which checks the keys, and only to this machine.
    # SeaweedFS's other ports let anyone read and write, so none is
    # published.
    ports:
      - 127.0.0.1:${AMPLOP_SEAWEEDFS_PORT:-8333}:8333
    volumes:
      - seaweedfs:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres:
  meilisearch-1.56.1:
  seaweedfs:
