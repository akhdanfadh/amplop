# A self-hosted inbok: PostgreSQL, Meilisearch for search, SeaweedFS for
# message content, a one-off migration, the inbok server, its background
# worker, and Caddy for HTTPS. Values come from deploy/.env; copy
# .env.example.
# From deploy/, start it with docker compose up -d --build, and upgrade it
# with ./upgrade.sh. The repository root's compose.yaml is for development.
#
# NOTE: The images below are pinned by version and digest, like the
# Dockerfile's base images; the Dockerfile says how to update a digest.

# Not "inbok": the development stack in a checkout named inbok has that
# name, and sharing it would share its database volume.
name: inbok-deploy

# migrate, inbok, and worker connect with this URL. The password is hex, so it needs
# no escaping here.
x-database-url: &database-url postgres://inbok:${INBOK_POSTGRES_PASSWORD:?set it in deploy/.env}@postgres:5432/inbok?sslmode=disable

# inbok and worker keep message content in SeaweedFS with these keys,
# which SeaweedFS takes as its admin identity on every start.
x-s3-access-key-id: &s3-access-key-id ${INBOK_S3_ACCESS_KEY_ID:?set it in deploy/.env}
x-s3-secret-access-key: &s3-secret-access-key ${INBOK_S3_SECRET_ACCESS_KEY:?set it in deploy/.env}

services:
  postgres:
    image: postgres:18.6-trixie@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    restart: unless-stopped
    environment:
      POSTGRES_USER: inbok
      POSTGRES_PASSWORD: ${INBOK_POSTGRES_PASSWORD:?set it in deploy/.env}
      POSTGRES_DB: inbok

    # PostgreSQL 18 and newer keep data under /var/lib/postgresql/18/docker;
    # mount the parent so data survives recreating the container.
    volumes:
      - postgres:/var/lib/postgresql

    # Ready means it accepts TCP connections. The first start runs a
    # temporary server on a Unix socket only, so a socket check would pass
    # too early. $$ makes Compose pass $ to the container's shell.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 3
      # The first start creates the database first, which can take a while
      # on a slow disk; failures in this time do not count.
      start_period: 60s
      start_interval: 2s

    # No published port, and on db only.
    networks:
      - db

  # The search index. It holds copies of PostgreSQL's data and can be
  # rebuilt from it, so its volume needs no backup.
  meilisearch:
    image: getmeili/meilisearch:v1.56.1@sha256:b7ba431bf6f9b26cc86132798f3640964147a699cf23f026b74c6c05dbb1d60d
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${INBOK_MEILISEARCH_KEY:?set it in deploy/.env}
      # Refuses a master key under 16 bytes and turns off the web
      # dashboard.
      MEILI_ENV: production
      # Meilisearch sends anonymous usage data unless this is set.
      MEILI_NO_ANALYTICS: "true"

    # NOTE: The volume is named after the image's version. A Meilisearch
    # version refuses to open data another version wrote, so an upgrade
    # starts on a new, empty volume and the index is rebuilt. Change the
    # name here and below whenever the image changes.
    volumes:
      - meilisearch-1.56.1:/meili_data

    # The image has curl. /health answers without the key.
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

    # No published port, and on db only: the browser never reaches it.
    networks:
      - db

  # Holds message content behind an S3 API: a cache of what Gmail has, so
  # its volume needs no backup. The image's version matches compose.yaml
  # and the Go tests' in backend/internal/s3; change all three together.
  seaweedfs:
    image: chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59
    restart: unless-stopped
    # One process runs every SeaweedFS part. A command replaces the image's
    # whole default, so -dir=/data, which keeps the data in the volume, is
    # repeated. The usage report SeaweedFS sends by default is off.
    command: mini -dir=/data -master.telemetry=false
    environment:
      AWS_ACCESS_KEY_ID: *s3-access-key-id
      AWS_SECRET_ACCESS_KEY: *s3-secret-access-key
    volumes:
      - seaweedfs:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

    # No published port, and on content only: its S3 port checks the keys,
    # but its other ports let anyone who reaches them read and write.
    networks:
      - content

  # Applies pending migrations, then exits. Every docker compose up or
  # start runs it again, which does nothing once the database is current.
  migrate:
    # The image the inbok service builds, so an upgrade migrates with the
    # code it then serves. Only inbok builds it: Compose would otherwise
    # build it once per service; worker uses it the same way.
    image: ${INBOK_IMAGE:-inbok:local}
    pull_policy: never
    command: migrate
    restart: "no"
    environment:
      INBOK_DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy

    # The image's check asks a server that migrate never starts.
    healthcheck:
      disable: true
    networks:
      - db

  inbok:
    # Built from the repository's Dockerfile. The image's own health check
    # runs inbok health, which caddy waits for below. Only upgrade.sh sets
    # INBOK_IMAGE, to build and migrate with a candidate image first.
    image: ${INBOK_IMAGE:-inbok:local}
    build:
      context: ..
    restart: unless-stopped
    environment:
      INBOK_DATABASE_URL: *database-url
      INBOK_ENCRYPTION_KEYS: ${INBOK_ENCRYPTION_KEYS:?set it in deploy/.env}
      INBOK_PUBLIC_URL: ${INBOK_PUBLIC_URL:?set it in deploy/.env}
      INBOK_SETUP_TOKEN: ${INBOK_SETUP_TOKEN:-}
      # Both empty: Gmail is not offered.
      INBOK_GOOGLE_CLIENT_ID: ${INBOK_GOOGLE_CLIENT_ID:-}
      INBOK_GOOGLE_CLIENT_SECRET: ${INBOK_GOOGLE_CLIENT_SECRET:-}
      INBOK_S3_ENDPOINT: http://seaweedfs:8333
      INBOK_S3_ACCESS_KEY_ID: *s3-access-key-id
      INBOK_S3_SECRET_ACCESS_KEY: *s3-secret-access-key
      # Caddy's own addresses below, and nothing else: a forwarded client
      # address from any other peer is ignored.
      INBOK_TRUSTED_PROXIES: 10.83.70.2/32,fd24:44bd:915f::2/128
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    # The image listens on 0.0.0.0:8080 with no published port. From
    # outside, only Caddy reaches it, on edge.
    networks:
      - edge
      - db
      - content

  # Runs background work. Restarting or replacing it is safe: work it left
  # unfinished resumes when it starts again under the same INBOK_WORKER_ID,
  # which defaults to "worker". A second worker at once needs its own ID.
  worker:
    image: ${INBOK_IMAGE:-inbok:local}
    pull_policy: never
    command: worker
    restart: unless-stopped
    # Its shutdown takes up to 12 seconds, past Docker's default 10 before
    # it kills. A kill is safe, just less tidy: unfinished work resumes.
    stop_grace_period: 15s
    environment:
      INBOK_DATABASE_URL: *database-url
      # The image's health check asks this address. Loopback: nothing else
      # needs to reach the worker. 8081 is the worker's port everywhere,
      # though its own container would allow serve's 8080 too.
      INBOK_HTTP_ADDR: 127.0.0.1:8081
      # It sends inbok's email: the keys decrypt the saved SMTP password,
      # and links in its messages start with the public URL.
      INBOK_ENCRYPTION_KEYS: ${INBOK_ENCRYPTION_KEYS:?set it in deploy/.env}
      INBOK_PUBLIC_URL: ${INBOK_PUBLIC_URL:?set it in deploy/.env}
      # It revokes a disconnected Gmail account's permission at Google
      # with the same client as inbok.
      INBOK_GOOGLE_CLIENT_ID: ${INBOK_GOOGLE_CLIENT_ID:-}
      INBOK_GOOGLE_CLIENT_SECRET: ${INBOK_GOOGLE_CLIENT_SECRET:-}
      # It applies the search index's settings when it starts.
      INBOK_MEILISEARCH_URL: http://meilisearch:7700
      INBOK_MEILISEARCH_KEY: ${INBOK_MEILISEARCH_KEY:?set it in deploy/.env}
      INBOK_S3_ENDPOINT: http://seaweedfs:8333
      INBOK_S3_ACCESS_KEY_ID: *s3-access-key-id
      INBOK_S3_SECRET_ACCESS_KEY: *s3-secret-access-key
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # edge for mail servers on the internet. Caddy shares it but cannot
    # reach the worker, which listens on loopback only.
    networks:
      - edge
      - db
      - content

  caddy:
    image: caddy:2.11.7@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e
    restart: unless-stopped
    environment:
      INBOK_DOMAIN: ${INBOK_DOMAIN:?set it in deploy/.env}

    # 80 answers certificate checks and redirects to HTTPS; 443/udp carries
    # HTTP/3.
    ports:
      - ${INBOK_CADDY_HTTP_PORT:-80}:80
      - ${INBOK_CADDY_HTTPS_PORT:-443}:443
      - ${INBOK_CADDY_HTTPS_PORT:-443}:443/udp

    # Caddy's image asks for its config folder, not the single file, so a
    # reload sees edits: docker compose exec -w /etc/caddy caddy caddy reload
    # /data holds the certificates and their keys: keep it, or Caddy asks
    # for new ones on every start and can hit the CA's rate limits.
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      inbok:
        condition: service_healthy
    networks:
      edge:
        ipv4_address: 10.83.70.2
        ipv6_address: fd24:44bd:915f::2

networks:
  # Caddy, inbok, and worker, with internet access for certificates and
  # system email. The subnets are fixed so inbok can trust exactly Caddy's
  # addresses. If one collides with a network on the host, change it, its
  # ip_range, and Caddy's addresses in both places above.
  edge:
    # With IPv6 here, Docker routes IPv6 visitors to Caddy directly and
    # keeps their addresses; on an IPv4-only network it relays them through
    # its own proxy, and they all arrive from one address. Direct routing
    # needs Docker's ip6tables setting, which is on by default.
    enable_ipv6: true
    ipam:
      config:
        - subnet: 10.83.70.0/28
          # Docker gives other containers addresses from here only, so none
          # takes Caddy's.
          ip_range: 10.83.70.8/29
        # A private IPv6 prefix, picked at random as RFC 4193 asks.
        - subnet: fd24:44bd:915f::/64
          ip_range: fd24:44bd:915f::1:0/112

  # PostgreSQL, Meilisearch, migrate, inbok, and worker, with no internet
  # access. Caddy is not on it, so the service facing the internet cannot
  # reach the database or the search index.
  db:
    internal: true

  # SeaweedFS, inbok, and worker, with no internet access. Only the two
  # services that hold its keys can reach it, since its ports other than
  # S3 need none.
  content:
    internal: true

# docker compose down -v deletes these: postgres holds the only copy of the
# database, and caddy-data the certificates. seaweedfs holds message
# content, which inbok fetches again from Gmail when it is gone. Plain down
# keeps them.
volumes:
  postgres:
  meilisearch-1.56.1:
  seaweedfs:
  caddy-data:
  caddy-config:
